# Deployed by sync: secret_key is a PLACEHOLDER, substituted in the DEPLOYED
# file only (stack_sync_configs: value from .env, chown 977:977, chmod 600).
# use_default_settings: true — any key not set below is inherited from the
# image's defaults; each set line is marked MATCHES UPSTREAM / DEVIATION for
# the image-bump diff (RUNBOOK → Web search).
use_default_settings: true
search:
  # DEVIATION (upstream [html]): json is the agent API surface — 403 without it
  formats: [html, json]
  # DEVIATION (upstream "duckduckgo"): no per-keystroke engine round trip
  autocomplete: ""
server:
  # MATCHES UPSTREAM (belt-and-braces): needs Valkey + trusted proxies, and
  # would 429 clients it can't see — which is the entire agent population
  limiter: false
  # MATCHES UPSTREAM: enabling it force-re-arms image_proxy=true server-side
  public_instance: false
  # DEVIATION (upstream false): a public URL, not a secret — delete this line
  # if the UI is dropped (upstream default = relative links)
  base_url: https://searx.pietrasik.top/
  # DEVIATION (upstream "ultrasecretkey"): effective only because the compose
  # env block carries no SEARXNG_SECRET (env > file — the allow-list controls)
  secret_key: "__SEARXNG_SECRET__"
general:
  # MATCHES UPSTREAM: with this true, the doctor's keyed /metrics probe tracks
  # open_metrics only — keep it true and open_metrics '', and NEVER set
  # open_metrics to LLM_API_KEY (the gate's Basic password IS that key)
  enable_metrics: true
preferences:
  # Structural, not a default: with the lock empty, ANY caller (cookie OR a
  # bare &image_proxy=1 on a keyed /search) re-arms image_proxy per request.
  # Locking makes the off stick (the two UI toggles go inert — intended for a
  # headless instance).
  lock: [image_proxy, autocomplete]
