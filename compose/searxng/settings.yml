# Deployed to /opt/panel/searxng/settings.yml (sync) — the container binds
# that dir to /etc/searxng read-only; the image's own /etc/searxng is never
# written in this mode.
#
# The one exception to the "repo stays clean" rule: secret_key below is a
# PLACEHOLDER — stack_sync_configs substitutes the token in the DEPLOYED
# file only (value from .env, generated by 01-secrets.sh) and
# chowns the deployed file 977:977 + chmod 600 (the app reads it as uid 977
# at import; root:root 0600 would be EACCES → crashloop). Every other line
# here is committed as-is. make doctor asserts zero __*__ tokens in the
# deployed file (a surviving placeholder means the sed line was skipped —
# the instance would then run on a literal public string).
#
# use_default_settings: true means EVERY key not set below is inherited
# from the defaults shipped inside the image (searx/settings.yml) — so a
# key that looks absent here can still be live. Each line below is
# annotated MATCHES UPSTREAM / DEVIATION; the doctor probes the
# security-critical ones (formats, the secret, open_metrics).
use_default_settings: true
search:
  # DEVIATION (upstream [html]): json is the agent API surface — 403 without
  # it. The single most likely silent misconfiguration; the doctor probes it
  # (keyed /search?format=json with no q → 400 means json is present).
  formats: [html, json]
  # DEVIATION (upstream "duckduckgo"): no per-keystroke engine round trip.
  autocomplete: ""
server:
  # MATCHES UPSTREAM (belt-and-braces; say so in review):
  limiter: false        # needs Valkey + trusted proxies; 429s clients it can't see
  public_instance: false # MATCHES UPSTREAM — and the reason matters: enabling
                         # it force-re-arms image_proxy=true server-side
                         # (init_settings in searx/__init__.py flips it AND
                         # adds it to preferences.lock). image_proxy re-arm
                         # is guarded four ways: the SEARXNG_IMAGE_PROXY env
                         # name (compose env allow-list); the per-request
                         # args/cookies (lock below); this flip (kept
                         # false); and the entrypoint's settings.template.yml,
                         # which ships image_proxy: true (live only in
                         # anonymous-volume mode — make doctor's mount
                         # check catches it)
  # DEVIATION (upstream false): base_url is a PUBLIC URL, not a secret.
  # SEARXNG_BASE_URL could carry it (env > file), but the compose env block
  # is reserved for the pinned names, and a public value belongs in the
  # repo-synced file. [If the UI is dropped, delete this line — upstream
  # default false = relative links.]
  base_url: https://searx.pietrasik.top/
  # DEVIATION (upstream "ultrasecretkey"): the placeholder is filled by
  # stack_sync_configs from .env (01-secrets.sh generates it) and the
  # deployed file is chowned 977:977 + chmod 600 — the app reads it as uid
  # 977 at import; root:root 0600 would be unreadable (EACCES → crashloop).
  # SearXNG applies env > file (SCHEMA in searx/settings_defaults.py —
  # "Is overwritten by ${SEARXNG_SECRET}" is accurate), so this line is
  # effective ONLY because the compose env block carries no SEARXNG_SECRET
  # (its only SEARXNG_* line is SEARXNG_PORT → server.port, not a guard
  # key — the named env allow-list). make doctor's effective-secret probe
  # re-runs the post-init check (the one the landing spike performed) at
  # day-2 cadence.
  secret_key: "__SEARXNG_SECRET__"
  # image_proxy: false — upstream's own value; do not enable without
  # re-reading the /image HMAC analysis. See preferences.lock below.
general:
  # MATCHES UPSTREAM — and the reason matters: /metrics answers 404 when
  # open_metrics is EMPTY OR enable_metrics is false — one condition — so
  # with this flag true, the doctor's keyed /metrics→404 probe tracks
  # open_metrics only. Writing enable_metrics: false would keep /metrics
  # 404 (the probe would NOT notice) while removing the stats surface from
  # the UI (the operational point — per-engine failure stats). Keep it
  # true, and keep open_metrics '' (upstream default — not written here)
  # — and NEVER set open_metrics to LLM_API_KEY: /metrics compares the Basic
  # password, and the gate's Basic branch password IS that key (doctor's
  # keyed /metrics→404 probe makes this structural).
  enable_metrics: true
preferences:
  # Structural, not a default: server.image_proxy: false is re-armable per
  # request. pre_request() merges GET args into the form dict and
  # parse_dict() skips only LOCKED settings, so any caller (cookie OR a
  # bare &image_proxy=1 on a keyed /search) re-arms the server-minted
  # /image URL path while lock is empty. Locking makes the off-decision
  # un-overridable. autocomplete locked in the same breath (same class).
  # Cost: the UI's two toggles go inert — intended for a headless instance.
  # Falsifiable test: with image_proxy=1 in a fresh cookie jar, result
  # URLs are still plain.
  lock: [image_proxy, autocomplete]
