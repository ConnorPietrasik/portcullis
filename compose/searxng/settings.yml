# Deployed to /opt/panel/searxng/settings.yml (sync) — the container binds
# that dir to /etc/searxng read-only.
# The one exception to "repo stays clean": secret_key is a PLACEHOLDER —
# stack_sync_configs substitutes it in the DEPLOYED file only (value from
# .env, generated by 01-secrets.sh), chowns the deployed file 977:977 +
# chmod 600 (root:root 0600 would be EACCES at import → crashloop). Every
# other line here is committed as-is. make doctor asserts zero __*__ tokens
# in the deployed file (a survivor means the sed line was skipped).
#
# use_default_settings: true — EVERY key not set below is inherited from
# the defaults shipped inside the image, so a key that looks absent here
# can still be live. Each line is annotated MATCHES UPSTREAM / DEVIATION;
# the doctor probes the security-critical ones.
use_default_settings: true
search:
  # DEVIATION (upstream [html]): json is the agent API surface — 403 without
  # it. The single most likely silent misconfiguration; the doctor probes it.
  formats: [html, json]
  # DEVIATION (upstream "duckduckgo"): no per-keystroke engine round trip
  autocomplete: ""
server:
  # MATCHES UPSTREAM (belt-and-braces): needs Valkey + trusted proxies, and
  # would 429 clients it can't see — which is the entire agent population
  limiter: false
  # MATCHES UPSTREAM — and the reason matters: enabling it force-re-arms
  # image_proxy=true server-side (init_settings flips it AND locks the
  # preference). image_proxy-off is guarded four ways: this, the per-request
  # lock below, the compose env allow-list (no SEARXNG_IMAGE_PROXY), and the
  # entrypoint's template (live only in anonymous-volume mode — the doctor's
  # mount check catches that one)
  public_instance: false
  # DEVIATION (upstream false): a PUBLIC URL, not a secret — a public value
  # belongs in the repo-synced file, not the pinned env block.
  # [If the UI is dropped, delete this line — upstream default false =
  # relative links.]
  base_url: https://searx.pietrasik.top/
  # DEVIATION (upstream "ultrasecretkey"): effective ONLY because the
  # compose env block carries no SEARXNG_SECRET (env > file — the compose
  # allow-list is the control; the doctor's effective-secret probe re-runs
  # the post-init check).
  secret_key: "__SEARXNG_SECRET__"
  # image_proxy: false — upstream's own value; do not enable without
  # re-reading the /image HMAC analysis. See preferences.lock below.
general:
  # MATCHES UPSTREAM — and the reason matters: /metrics answers 404 when
  # open_metrics is EMPTY (one condition), so with this flag true the
  # doctor's keyed /metrics→404 probe tracks open_metrics only. Keep it true
  # (per-engine failure stats in the UI) and open_metrics '' — and NEVER set
  # open_metrics to LLM_API_KEY: /metrics compares the Basic password, and
  # the gate's Basic branch password IS that key.
  enable_metrics: true
preferences:
  # Structural, not a default: with the lock empty, ANY caller (cookie OR a
  # bare &image_proxy=1 on a keyed /search) re-arms image_proxy per request
  # (pre_request merges GET args; parse_dict skips only LOCKED settings).
  # Locking makes the off-stick. Cost: the two UI toggles go inert — intended
  # for a headless instance.
  lock: [image_proxy, autocomplete]
