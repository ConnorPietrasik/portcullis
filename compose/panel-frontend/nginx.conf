server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # /api is routed to the host API by Traefik before it reaches this container.
    location /api {
        return 404;
    }

    # Gen artifacts: the host's /models/gen-output is ro-bound to /gen (panel-api
    # writes them on job completion; this container only serves them). ^~ is
    # required — otherwise the image regex below wins and 404s on the wrong root.
    # The URI allowlist mirrors gen_jobs' artifact naming (job-*.ext + thumbs):
    # the dir is panel-owned, but nothing else should ever be served from it.
    location ^~ /gen/ {
        alias /gen/;
        if ($uri !~ "^/gen/job-[0-9]+(-thumb)?\.(png|jpg|jpeg|webp|webm|mp4)$") {
            return 404;
        }
        expires 7d;
        # private: authenticated panel content (Authelia) — browsers may cache,
        # shared caches may not
        add_header Cache-Control "private";
    }

    location / {
        # index.html must not be cached — assets are hash-named and safe to
        # cache, but a stale shell would reference old hashes after a redeploy.
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|svg|png|jpg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
