# Secrets are injected via the AUTHELIA_* environment — never stored here.

theme: dark

server:
  address: 'tcp://0.0.0.0:9091/'

log:
  level: info

authentication_backend:
  password_reset:
    disable: true
  file:
    path: /config/users_database.yml

access_control:
  # Order matters: first match wins — specific rules BEFORE the wildcard, the
  # bare-domain bypass LAST (a new subdomain is private-by-default).
  default_policy: deny
  rules:
    - domain: auth.pietrasik.top
      policy: bypass

    - domain: panel.pietrasik.top
      policy: two_factor
      subject: ['group:admins']
    - domain: panel.pietrasik.top
      policy: deny # without this catch-all, non-admins fall to the wildcard below and are admitted after 2FA

    - domain: servitor.pietrasik.top
      policy: two_factor
      subject: ['group:admins']
    - domain: servitor.pietrasik.top
      policy: deny

    # Example rules — uncomment (kept ABOVE the wildcard) when you add these apps:
    # - domain: jellyfin.pietrasik.top # friends-only app
    #   policy: two_factor
    #   subject: ['group:friends']
    # - domain: demo.pietrasik.top # public demo — the app does its own auth
    #   policy: bypass

    - domain: www.pietrasik.top
      policy: bypass

    - domain: '*.pietrasik.top'
      policy: two_factor

    - domain: pietrasik.top
      policy: bypass

session:
  cookies:
    - name: authelia_session
      domain: pietrasik.top
      authelia_url: https://auth.pietrasik.top
      default_redirection_url: https://pietrasik.top
      same_site: lax
      inactivity: 15m
      expiration: 1h
      remember_me: 30d

storage:
  local:
    path: /config/db.sqlite3

totp:
  issuer: pietrasik.top
  skew: 1

notifier:
  filesystem:
    filename: /config/notification.txt
