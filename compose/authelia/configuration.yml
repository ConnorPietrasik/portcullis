# Authelia configuration. Secrets are injected via the AUTHELIA_*
# environment (docker-compose.yml), never stored in this file.
# Docs: https://www.authelia.com/configuration/prologue/introduction/

theme: dark

server:
  address: 'tcp://0.0.0.0:9091/'

log:
  level: info

authentication_backend:
  password_reset:
    disable: true # filesystem notifier can't send mail; reset via CLI if needed
  file:
    path: /config/users_database.yml

# Order matters: first match wins. Specific rules BEFORE the wildcard; the
# bare-domain bypass stays LAST so any new subdomain is private-by-default
# (it falls to the *.pietrasik.top rule above it).
access_control:
  default_policy: deny
  rules:
    - domain: auth.pietrasik.top
      policy: bypass

    - domain: panel.pietrasik.top
      policy: two_factor
      subject: ['group:admins'] # only admins — a subject rule only MATCHES
                                # admins; the deny below EXCLUDES everyone else
    - domain: panel.pietrasik.top
      policy: deny # without this catch-all, non-admins fall through to the
                   # wildcard below and are admitted after 2FA

    - domain: servitor.pietrasik.top
      policy: two_factor
      subject: ['group:admins'] # same two-rule pattern as the panel
    - domain: servitor.pietrasik.top
      policy: deny

    # Example rules — uncomment (kept ABOVE the wildcard) when you add these
    # apps; until then they are dead weight (no matching router exists):
    # - domain: jellyfin.pietrasik.top # friends-only app
    #   policy: two_factor
    #   subject: ['group:friends']
    # - domain: demo.pietrasik.top # public demo — the app does its own auth
    #   policy: bypass

    - domain: www.pietrasik.top # portfolio: public
      policy: bypass

    - domain: '*.pietrasik.top' # everything else: any authenticated user
      policy: two_factor

    - domain: pietrasik.top # portfolio: public (bare domain + www above)
      policy: bypass

session:
  # default_redirection_url MUST be per-cookie (4.38+ multi-domain
  # protection): a top-level one is a hard startup error while cookies[] is
  # configured.
  cookies:
    - name: authelia_session
      domain: pietrasik.top
      authelia_url: https://auth.pietrasik.top
      default_redirection_url: https://pietrasik.top
      same_site: lax
      inactivity: 15m
      expiration: 1h
      remember_me: 30d

storage:
  local:
    path: /config/db.sqlite3

totp:
  issuer: pietrasik.top
  skew: 1

notifier:
  filesystem:
    filename: /config/notification.txt
