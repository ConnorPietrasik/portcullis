# Edge stack: traefik + authelia + panel UI.
# Deployed to /opt/panel by setup/02-deploy-stack.sh (which fills in .env).
#
# Routing (all TLS via the *.pietrasik.top wildcard cert, DNS-01 via NameSilo):
#   pietrasik.top            → portfolio container (public, uncomment below)
#   panel.pietrasik.top/     → panel-web (Authelia: admins)
#   panel.pietrasik.top/api  → host API :8010 (Authelia + X-Panel-Token, via docker0 gateway 172.17.0.1)
#   search.pietrasik.top     → searxng (agent API — panel-api forwardAuth gate, bearer LLM_API_KEY)
#   searx.pietrasik.top      → searxng (browser UI — Authelia)
#   auth.pietrasik.top       → authelia portal
#
# Traefik runs the FILE provider only (traefik/dynamic/*.yml) — no docker
# provider, no docker.sock (a ro-mounted socket still grants full Docker API
# access). Adding an app = compose service on `edge` + a router/service in
# traefik/dynamic/ (see docs/RUNBOOK.md → “add an app”).

# Log rotation — docker's json-file driver grows unbounded by default.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Healthcheck cadence (shared). Deliberately lazy: one loopback request per
# container per interval, while a hang still surfaces as unhealthy after
# interval × retries (~6 min). Healthchecks diagnose; they never restart.
x-healthcheck: &healthcheck-opts
  interval: 2m
  timeout: 10s
  retries: 3
  start_period: 1m

# LLM fleet boilerplate — merged into every llm-* block via `<<: *llm-base`.
# What varies per instance: environment (ROCR_VISIBLE_DEVICES + key), command,
# labels. Everything else is identical for every radiance server, so it lives
# once here.
x-llm-base: &llm-base
  image: stilldeadcode/radiance:latest # the ONE image deliberately OUTSIDE the
  # declared-line policy — frequent builds are wanted. A build that passes the
  # gates but breaks behavior: make rollback WHAT=radiance (RUNBOOK → LLM fleet)
  restart: "no" # the fleet must not resurrect itself after a reboot — you pick
  # the set from the panel (edge services stay unless-stopped)
  init: true # forwards SIGTERM; the engine finishes its step and releases the cards
  logging: *default-logging
  user: "1000:1000"
  devices: ["/dev/kfd", "/dev/dri"] # all cards visible; ROCR_VISIBLE_DEVICES pins the set
  # Host-LOCAL gids (Arch assigns dynamically — not portable across boxes):
  # render=987, video=983 on omnissiah. Verify: getent group render video,
  # then confirm the device owners: stat -c '%n %u:%g' /dev/kfd /dev/dri/*
  group_add: ["987", "983"]
  security_opt:
    # radiance's io_uring reads + ROCm's NUMA binding (mbind/set_mempolicy)
    # are refused by Docker's default seccomp. Both are in the UPSTREAM
    # radiance repo (codeberg.org/StillDeadcode/radiance) — see its
    # deploy/compose/common.yaml and the tighter profile it ships
    # (deploy/compose/seccomp-radiance.json) if you ever want to run confined.
    - seccomp=unconfined
  ulimits:
    memlock: -1
  volumes:
    - /models/llm:/models:ro
    # only if a model needs a CUSTOM chat template (rare — the .rad carries
    # its own): mount the .jinja and pass --chat-template (radiance upstream)
  stop_grace_period: 60s # finishes the in-flight step, releases the cards
  healthcheck:
    interval: 1m
    timeout: 10s
    retries: 3
    start_period: 5m # the MODEL LOAD is the slow part: ~1m on this hardware,
    test: ["CMD", "busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
    # 5m is the margin — shorter reads unhealthy mid-load and make update's
    # 600s gate auto-rolls-back while a reload is still loading (raise
    # UPDATE_HEALTH_TIMEOUT only for a much slower model — RUNBOOK → LLM fleet)
  networks: [edge] # NO network_mode: host — on the bridge, port 8000 is
  # reachable only from traefik (no UFW rule, no LAN/WAN exposure), so the
  # server binds 0.0.0.0 instead of the playground's --host ::

services:
  traefik:
    # Image policy: floats on the MAJOR line — patch/minor security releases
    # ride in on `make update` (snapshot + gate + auto-rollback); a major is a
    # deliberate one-word edit — that's where breaking changes live.
    image: traefik:v3
    restart: unless-stopped
    logging: *default-logging
    ports: ["80:80", "443:443"]
    healthcheck:
      <<: *healthcheck-opts
      test: ["CMD", "traefik", "healthcheck", "--ping"]
    environment:
      NAMESILO_API_KEY: ${NAMESILO_API_KEY}
      NAMESILO_PROPAGATION_TIMEOUT: ${NAMESILO_PROPAGATION_TIMEOUT:-1800} # NameSilo TTLs are slow; keep this high (seconds!)
      # The one-time `*` CNAME (RUNBOOK Phase 0) makes _acme-challenge.pietrasik.top
      # a wildcard-synthesized CNAME, which lego would follow during DNS-01 and
      # misplace the challenge TXT (go-acme/lego#1816). Disabling CNAME follow
      # pins the standard behavior: TXT at _acme-challenge.pietrasik.top, where
      # the explicit record wins over the wildcard.
      LEGO_DISABLE_CNAME_SUPPORT: "true"
    labels:
      - panel.manage=edge router # shows in the panel's Services view
      - panel.category=Panel # group header in the Services view (absent → "Other")
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - acme:/letsencrypt
    networks: [edge]

  authelia:
    image: authelia/authelia:4 # same policy: floats on the major line (make update / RUNBOOK → Updates)
    restart: unless-stopped
    logging: *default-logging
    volumes: ["./authelia:/config"]
    networks: [edge]
    healthcheck:
      <<: *healthcheck-opts
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9091/api/health"]
    environment:
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET}
    labels:
      - panel.manage=true # routed via traefik/dynamic/authelia.yml, not labels
      - panel.category=Panel

  panel-web:
    build: ./panel-frontend
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      <<: *healthcheck-opts
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
    labels: ["panel.manage=true", "panel.category=Panel"] # routed via traefik/dynamic/panel.yml
    networks: [edge]

  # Public portfolio site (bare domain — Authelia bypass rule for pietrasik.top
  # already lives in configuration.yml). Placeholder page for now; replace
  # compose/portfolio/index.html with the real site whenever it exists.
  portfolio:
    image: nginx:stable-alpine # current stable (oldstable) line, floats; use `alpine` to track mainline
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      <<: *healthcheck-opts
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
    volumes: ["./portfolio:/usr/share/nginx/html:ro"]
    labels: ["panel.manage=true", "panel.category=Web"] # shows in the panel's Services view
    networks: [edge]

  # ── LLM fleet (Radiance) — start/stop instances from the panel ──────────────
  # An instance = one block here + one router pair in traefik/dynamic/llm.yml:
  # llm-<name> ↔ <name>.pietrasik.top. Port always 8000 (own IP per container).
  #
  # CARDS: the GPU view (panel tab "GPUs") assigns card sets per instance at
  # run time — it pins ROCR_VISIBLE_DEVICES through /opt/panel-api/llm-gpu-
  # override.yml (every compose render includes it), so the pins below are
  # FALLBACK DEFAULTS for a hand-run compose, not the running truth. llm.cards
  # is how many cards the instance NEEDS (keep == --tp) — the pool's auto-
  # grab sizes off it. The display name (panel.manage) has no card set in it
  # (the set moves — and no commas: docker ps encodes labels comma-joined).
  # restart "no" so a reboot never resurrects the set you chose; the boot
  # autostart list (GPU view) is what comes back. Model files:
  # /models/llm/*.rad (ro-mounted at /models). New instance (including a
  # second copy of a model, e.g. llm-27b-1): copy the block + the router pair
  # (RUNBOOK → LLM fleet; make doctor checks all five name references match),
  # make update, then assign cards in the GPU view.
  llm-27b:
    <<: *llm-base
    environment:
      ROCR_VISIBLE_DEVICES: "0,1" # fallback default (the GPU view's override wins): 2 cards — the
      # IQR-V4 vocabulary-weighted lm_head (output.k<B>) only shards at tp<=2 — class row counts
      # are multiples of 512, not 1024 (radiance: "rows a multiple of 256 a rank")
      RADIANCE_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env} # read by --api-key-env, so the key
      # never sits in argv (ps / docker inspect)
      RADIANCE_LOG: "warn" # per-request INFO lines (tok/s, cache, ttft) are chatty — radiance docs §6.5
    # bf16 KV (no --kv-cache-dtype: fp8 diverges on long contexts). VRAM holds ~612k tokens;
    # the host tier keeps evicted context for re-prefill: 40 GiB = 655k tokens, so 6 x 200k
    # realistic sessions (1.2M) stay resident-or-retained. Box has 251 GiB RAM.
    command: >
      --model /models/qwen3.8-27b-iq6r-s-v4.rad
      --host 0.0.0.0 --port 8000 --api-key-env RADIANCE_API_KEY
      --tp 2 --max-num-seqs 6 --max-model-len 250000
      --gpu-headroom-mib 96 --prefix-cache-mib 40960 --checkpoint-policy tip-only
      --num-speculative-tokens 3 --max-num-batched-tokens 2048
    labels:
      - panel.manage=Qwen 27B IQ6R-S-V4 # Services view name (no card set — it moves)
      - panel.category=LLM # NOT on x-llm-base: the per-block labels list replaces
      # the anchor's on merge (shallow <<), so new instances carry it by copying the block
      - llm.cards=2 # the pool's auto-grab size (== --tp)
  llm-27b-1:
    <<: *llm-base
    environment:
      ROCR_VISIBLE_DEVICES: "2,3"
      RADIANCE_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      RADIANCE_LOG: "warn"
    command: >
      --model /models/qwen3.8-27b-iq6r-s-v4.rad
      --host 0.0.0.0 --port 8000 --api-key-env RADIANCE_API_KEY
      --tp 2 --max-num-seqs 6 --max-model-len 250000
      --gpu-headroom-mib 96 --prefix-cache-mib 40960 --checkpoint-policy tip-only
      --num-speculative-tokens 3 --max-num-batched-tokens 2048
    labels:
      - panel.manage=Qwen 27B IQ6R-S-V4 1
      - panel.category=LLM
      - llm.cards=2
  llm-27b-2:
    <<: *llm-base
    environment:
      ROCR_VISIBLE_DEVICES: "4,5"
      RADIANCE_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      RADIANCE_LOG: "warn"
    command: >
      --model /models/qwen3.8-27b-iq6r-s-v4.rad
      --host 0.0.0.0 --port 8000 --api-key-env RADIANCE_API_KEY
      --tp 2 --max-num-seqs 6 --max-model-len 250000
      --gpu-headroom-mib 96 --prefix-cache-mib 40960 --checkpoint-policy tip-only
      --num-speculative-tokens 3 --max-num-batched-tokens 2048
    labels:
      - panel.manage=Qwen 27B IQ6R-S-V4 2
      - panel.category=LLM
      - llm.cards=2
  llm-flashnext:
    <<: *llm-base
    environment:
      ROCR_VISIBLE_DEVICES: "0,1,2,3" # fallback default (override wins): same four cards as
      # llm-27b's — not at the same time
      RADIANCE_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      RADIANCE_LOG: "warn"
    command: >
      --model /models/qwen3.8-next-flash-fp8-iq4r-moe.rad
      --host 0.0.0.0 --port 8000 --api-key-env RADIANCE_API_KEY
      --tp 4 --max-num-seqs 8 --max-model-len 250000
      --placement expert_tiered --host-pool-mib 24576 --gpu-headroom-mib 96
      --prefix-cache-mib 65536 --checkpoint-policy tip-only
      --num-speculative-tokens 3 --max-num-batched-tokens 2048
    labels:
      - panel.manage=Qwen Flash-Next # Services view name (no card set — it moves)
      - panel.category=LLM
      - llm.cards=4 # the pool's auto-grab size (== --tp)

  # ── SearXNG — web search for agents + private browser UI ──────────────────
  # Image floats on latest — declared OUTSIDE the declared-line policy (the
  # radiance precedent): the project ships rolling date tags, no releases.
  # Bad build: make rollback WHAT=searxng (IMAGE ONLY — a settings rollback
  # needs the FULL make rollback). Hold a known build: pin the tag.
  # Image-bump duty (RUNBOOK → Web search): diff our settings.yml against the
  # file the new image ships — under use_default_settings, an upstream default
  # flip is a silent behavior change (formats is the live example) — AND diff
  # searx/settings_defaults.py's SCHEMA: the environ_name list (a new
  # env-override name is a new channel over our settings.yml) AND the default
  # values (a flip for a key our settings.yml doesn't set is invisible in the
  # shipped-file diff; the doctor's probes cover the security-critical ones),
  # confirm the app uid is still 977 (the compose user pin, the sync's chown
  # target and the doctor's owner check all name it), and re-run the
  # effective-secret probe (RUNBOOK → Web search → image-bump duty; make
  # doctor carries it).
  searxng:
    image: searxng/searxng:latest
    # restart: unless-stopped — and do NOT merge x-llm-base (it carries
    # restart: "no", which the update's on-demand test treats as "leave
    # down"). searxng is always-on, not on-demand.
    restart: unless-stopped
    logging: *default-logging
    # The image's own uid (the image sets no USER — a bare `docker run` is
    # root; this line is what drops the app to 977). As 977 the entrypoint
    # can't chown, so it prints ONE benign 'is not owned by
    # "searxng:searxng"' line per start and continues — for the config DIR, which the sync's
    # tar leaves non-977 (the data volume seeds 977:977 from the image and
    # stays quiet; the log-line count is in the RUNBOOK verification). Nothing
    # in the normal path writes the config dir (we ship settings.yml, so the
    # template copy never runs) — but the app READS it: the sync chowns the
    # deployed settings.yml to 977:977 (root:root 0600 would be EACCES at
    # import → crashloop). RUNBOOK pre-empts the three wrong fixes: dropping
    # user: (root + FORCE_OWNERSHIP=true → chown -R of the synced tree every
    # start), hand-chown under /opt/panel (undone by the next tar sync — the
    # sync's OWN chown line is the sanctioned one), making the mount writable
    # to silence it.
    user: "977:977"
    environment:
      # NO SEARXNG_SECRET line — and this absence is a security control,
      # not an omission: SearXNG applies env > settings.yml (SCHEMA in
      # searx/settings_defaults.py). The secret rides the sed machinery:
      # .env → stack_sync_configs substitutes the secret_key placeholder
      # in the deployed searxng/settings.yml (chown 977:977 + chmod 600 —
      # the app reads it as 977). An env line here would OVERRIDE the file
      # — and put the secret in the container environ (docker inspect),
      # the exposure the reduced-env files exist to avoid.
      # (This prose deliberately never writes the placeholder token: this
      # file is inside the sync's placeholder-survival grep, which dies on
      # ANY token it finds, and the sed never rewrites this file — a named
      # token in a comment would red-light every update.)
      # The listener port is env-owned (entrypoint aliases
      # SEARXNG_PORT→GRANIAN_PORT); pin it or an upstream default change
      # moves the listener out from under the route, the healthcheck and
      # the gate.
      SEARXNG_PORT: "8080"
      # Makes the "drop user:" wrong-fix harmless instead of chown -R'ing
      # the repo-synced tree.
      FORCE_OWNERSHIP: "false"
      # The image's real capacity ceiling is ~4 concurrent requests, not
      # the rate limit. The image's ENV default is ALREADY 4 — this pin is
      # a no-op today; its job is to keep a future upstream default change
      # from moving the ceiling (that change shows up in the image-bump
      # Dockerfile diff, not as silent queueing). (Doctor enforces this
      # block as a NAMED allow-list — additions are a deliberate diff,
      # illegal members fail, and a guard key fails loudly. GRANIAN_HOST
      # is NOT a member: the 2026-11-13 spike forced no host pin — both
      # loopback families answered.)
      GRANIAN_BLOCKING_THREADS: "4"
    healthcheck:
      <<: *healthcheck-opts
      # The image ships NO HEALTHCHECK, and make update counts a
      # healthcheck-less running container as healthy — this test is the
      # only health gate. Loopback family verified 2026-11-13 (127.0.0.1
      # answers; [::1] does too — dual-stack, no GRANIAN_HOST pin).
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
    volumes:
      # The image declares /etc/searxng as a VOLUME — a dropped or renamed
      # bind does not fail: Docker hands out an ANONYMOUS volume, the
      # entrypoint copies the upstream template in (the template's own
      # image_proxy: true; formats: [html] inherited from the shipped
      # defaults it use_default_settings's), and the instance boots
      # healthy (agents 403, healthcheck green, compose diff clean).
      # make doctor's mount check asserts the exact bind — anonymous
      # volumes carry NO inspect flag, so it greps the bind string, not
      # 'AnonymousVolume'.
      - ./searxng:/etc/searxng:ro
      # Named volume, never a repo bind — runtime data must not flow back
      # into the repo. Seeded from the image's 977:977 dir (no warning).
      - searxng-cache:/var/cache/searxng
    labels:
      - panel.manage=SearXNG     # Services view: start/stop like any app
      - panel.category=Search    # unpinned groups sort alphabetically by
                                 # design — no frontend code; do NOT pin
                                 # 'Search' in CATEGORY_ORDER
    networks: [edge]
    # NO published ports. The only internet path is the two routers in
    # traefik/dynamic/search.yml; the API router is whole-host key-gated
    # (see its header).

volumes:
  acme: {}
  searxng-cache: {}

networks:
  edge:
    external: true
