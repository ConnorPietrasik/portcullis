# Edge stack: traefik + authelia + panel UI.
# Deployed to /opt/panel by setup/02-deploy-stack.sh (which fills in .env).
#
# Routing (all TLS via the *.pietrasik.top wildcard cert, DNS-01 via NameSilo):
#   pietrasik.top            → portfolio container (public, uncomment below)
#   panel.pietrasik.top/     → panel-web (Authelia: admins)
#   panel.pietrasik.top/api  → host API :8010 (Authelia + X-Panel-Token, via docker0 gateway 172.17.0.1)
#   auth.pietrasik.top       → authelia portal
#
# Traefik runs the FILE provider only (traefik/dynamic/*.yml) — no docker
# provider, no docker.sock (a ro-mounted socket still grants full Docker API
# access). Adding an app = compose service on `edge` + a router/service in
# traefik/dynamic/ (see docs/RUNBOOK.md → “add an app”).

# Log rotation — docker's json-file driver grows unbounded by default.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Healthcheck cadence (shared). Deliberately lazy: one loopback request per
# container per interval, while a hang still surfaces as unhealthy after
# interval × retries (~6 min). Healthchecks diagnose; they never restart.
x-healthcheck: &healthcheck-opts
  interval: 2m
  timeout: 10s
  retries: 3
  start_period: 1m

# LLM fleet boilerplate — merged into every llm-* block via `<<: *llm-base`.
# What varies per instance: environment (ROCR_VISIBLE_DEVICES + key), command,
# labels. Everything else is identical for every radiance server, so it lives
# once here.
x-llm-base: &llm-base
  image: stilldeadcode/radiance:latest # the ONE image deliberately OUTSIDE the
  # declared-line policy — frequent builds are wanted. A build that passes the
  # gates but breaks behavior: make rollback WHAT=radiance (RUNBOOK → LLM fleet)
  restart: "no" # the fleet must not resurrect itself after a reboot — you pick
  # the set from the panel (edge services stay unless-stopped)
  init: true # forwards SIGTERM; the engine finishes its step and releases the cards
  logging: *default-logging
  user: "1000:1000" # verify: id crazybot (files the server writes are its user's)
  devices: ["/dev/kfd", "/dev/dri"] # all cards visible; ROCR_VISIBLE_DEVICES pins the set
  group_add: ["992", "44"] # verify: getent group render video
  security_opt:
    # radiance's io_uring reads + ROCm's NUMA binding (mbind/set_mempolicy)
    # are refused by Docker's default seccomp. Both are in the UPSTREAM
    # radiance repo (codeberg.org/StillDeadcode/radiance) — see its
    # deploy/compose/common.yaml and the tighter profile it ships
    # (deploy/compose/seccomp-radiance.json) if you ever want to run confined.
    - seccomp=unconfined
  ulimits:
    memlock: -1
  volumes:
    - /models/llm:/models:ro
    # only if a model needs a CUSTOM chat template (rare — the .rad carries
    # its own): mount the .jinja and pass --chat-template (radiance upstream)
  stop_grace_period: 60s # finishes the in-flight step, releases the cards
  healthcheck:
    interval: 1m
    timeout: 10s
    retries: 3
    start_period: 5m # the MODEL LOAD is the slow part: ~1m on this hardware,
    test: ["CMD", "busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
    # 5m is the margin — shorter reads unhealthy mid-load and make update's
    # 600s gate auto-rolls-back while a reload is still loading (raise
    # UPDATE_HEALTH_TIMEOUT only for a much slower model — RUNBOOK → LLM fleet)
  networks: [edge] # NO network_mode: host — on the bridge, port 8000 is
  # reachable only from traefik (no UFW rule, no LAN/WAN exposure), so the
  # server binds 0.0.0.0 instead of the playground's --host ::

services:
  traefik:
    # Image policy: floats on the MAJOR line — patch/minor security releases
    # ride in on `make update` (snapshot + gate + auto-rollback); a major is a
    # deliberate one-word edit — that's where breaking changes live.
    image: traefik:v3
    restart: unless-stopped
    logging: *default-logging
    ports: ["80:80", "443:443"]
    healthcheck:
      <<: *healthcheck-opts
      test: ["CMD", "traefik", "healthcheck", "--ping"]
    environment:
      NAMESILO_API_KEY: ${NAMESILO_API_KEY}
      NAMESILO_PROPAGATION_TIMEOUT: ${NAMESILO_PROPAGATION_TIMEOUT:-1800} # NameSilo TTLs are slow; keep this high (seconds!)
      # The one-time `*` CNAME (RUNBOOK Phase 0) makes _acme-challenge.pietrasik.top
      # a wildcard-synthesized CNAME, which lego would follow during DNS-01 and
      # misplace the challenge TXT (go-acme/lego#1816). Disabling CNAME follow
      # pins the standard behavior: TXT at _acme-challenge.pietrasik.top, where
      # the explicit record wins over the wildcard.
      LEGO_DISABLE_CNAME_SUPPORT: "true"
    labels:
      - panel.manage=edge router # shows in the panel's Services view
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - acme:/letsencrypt
    networks: [edge]

  authelia:
    image: authelia/authelia:4 # same policy: floats on the major line (make update / RUNBOOK → Updates)
    restart: unless-stopped
    logging: *default-logging
    volumes: ["./authelia:/config"]
    networks: [edge]
    healthcheck:
      <<: *healthcheck-opts
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9091/api/health"]
    environment:
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET}
    labels:
      - panel.manage=true # routed via traefik/dynamic/authelia.yml, not labels

  panel-web:
    build: ./panel-frontend
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      <<: *healthcheck-opts
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
    labels: ["panel.manage=true"] # routed via traefik/dynamic/panel.yml
    networks: [edge]

  # Public portfolio site (bare domain — Authelia bypass rule for pietrasik.top
  # already lives in configuration.yml). Placeholder page for now; replace
  # compose/portfolio/index.html with the real site whenever it exists.
  portfolio:
    image: nginx:stable-alpine # current stable (oldstable) line, floats; use `alpine` to track mainline
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      <<: *healthcheck-opts
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
    volumes: ["./portfolio:/usr/share/nginx/html:ro"]
    labels: ["panel.manage=true"] # shows in the panel's Services view
    networks: [edge]

  # ── LLM fleet (Radiance) — start/stop instances from the panel ──────────────
  # An instance = one block here + one router pair in traefik/dynamic/llm.yml:
  # llm-<name> ↔ <name>.pietrasik.top. Cards: ROCR_VISIBLE_DEVICES "i,j,k"
  # (fixed 0-5) + --tp = card count. Port always 8000 (own IP per container).
  # The display name (panel.manage) shows the card set — no commas in it
  # (docker ps encodes labels comma-joined). restart "no" so a reboot never
  # resurrects the set you chose. Model files: /models/llm/*.rad (ro-mounted
  # at /models). New instance: clone a block + the router pair — a block's
  # flags are this host's own tuning; the committed blocks are the truth, not
  # upstream's. Trialing a model first: temp-clone radiance upstream, run its
  # deploy/compose/<model>.yaml ad hoc, delete the clone (RUNBOOK → LLM fleet).
  #
  # ── the fleet — uncomment to activate, then: make update
  #
  # llm-27b:
  #   <<: *llm-base
  #   environment:
  #     ROCR_VISIBLE_DEVICES: "0,1,2,3" # cards by index (fixed 0-5)
  #     RADIANCE_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env} # read by --api-key-env,
  #                                     # so the key never sits in argv (ps / docker inspect)
  #   command: >
  #     --model /models/qwen3.8-27b-fp8.rad
  #     --host 0.0.0.0 --port 8000 --api-key-env RADIANCE_API_KEY
  #     --tp 4 --max-num-seqs 16 --max-model-len 250000
  #     --gpu-headroom-mib 96 --prefix-cache-mib 65536 --checkpoint-policy tip-only
  #     --num-speculative-tokens 3 --max-num-batched-tokens 2048
  #     --checkpoint-slots auto
  #   labels: ["panel.manage=Qwen 27B FP8 · cards 0-3"] # Services view name
  #
  # llm-flashnext:
  #   <<: *llm-base
  #   environment:
  #     ROCR_VISIBLE_DEVICES: "0,1,2,3" # same four cards as llm-27b — not at the same time
  #     RADIANCE_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
  #   command: >
  #     --model /models/qwen3.8-next-flash-fp8-iq4r-moe.rad
  #     --host 0.0.0.0 --port 8000 --api-key-env RADIANCE_API_KEY
  #     --tp 4 --max-num-seqs 8 --max-model-len 250000
  #     --placement expert_tiered --host-pool-mib 24576 --gpu-headroom-mib 96
  #     --prefix-cache-mib 65536 --checkpoint-policy tip-only
  #     --num-speculative-tokens 3 --max-num-batched-tokens 2048
  #   labels: ["panel.manage=Qwen Flash-Next · cards 0-3"] # Services view name

volumes:
  acme: {}

networks:
  edge:
    external: true
