# Edge stack: traefik + authelia + panel UI.
# Deployed to /opt/panel by setup/02-deploy-stack.sh (which fills in .env).
#
# Routing (all TLS via the *.pietrasik.top wildcard cert, DNS-01 via NameSilo):
#   pietrasik.top            → portfolio container (public, uncomment below)
#   panel.pietrasik.top/     → panel-web (Authelia: admins)
#   panel.pietrasik.top/api  → host API :8010 (Authelia + X-Panel-Token, via host.docker.internal)
#   auth.pietrasik.top       → authelia portal
#
# Traefik runs the FILE provider only (traefik/dynamic/*.yml) — it has no
# docker provider and mounts NO docker.sock (a ro-mounted socket still grants
# full Docker API access, and traefik is the internet-facing process).
# Adding an app = compose service on `edge` + a router/service in
# traefik/dynamic/ (see docs/RUNBOOK.md → “add an app”).

# Log rotation — docker's json-file driver grows unbounded by default, and
# traefik's accessLog writes every request. Applied to every service below.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Healthcheck cadence (shared). Deliberately lazy: one loopback request per
# container per interval — unmeasurable cost — while a hang still surfaces as
# unhealthy after interval × retries (~6 min). Shows in docker ps / the
# panel's Services view. Healthchecks never restart anything; they diagnose.
x-healthcheck: &healthcheck-opts
  interval: 2m
  timeout: 10s
  retries: 3
  start_period: 1m

services:
  traefik:
    # Image policy: pinned at the MINOR line, patches float. Patch releases are
    # security/bugfixes only — they ride in on `make deploy` (which pulls);
    # minor bumps are deliberate edits here (breaking changes live in minors).
    image: traefik:v3.7
    restart: unless-stopped
    logging: *default-logging
    ports: ["80:80", "443:443"]
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      <<: *healthcheck-opts
      test: ["CMD", "traefik", "healthcheck", "--ping"]
    environment:
      NAMESILO_API_KEY: ${NAMESILO_API_KEY}
      NAMESILO_PROPAGATION_TIMEOUT: ${NAMESILO_PROPAGATION_TIMEOUT:-30m} # NameSilo TTLs are slow; keep this
    labels:
      - panel.manage=edge router # shows in the panel's Services view
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - acme:/letsencrypt
    networks: [edge]

  authelia:
    image: authelia/authelia:4.39 # same policy: patches float, minors bump deliberately
    restart: unless-stopped
    logging: *default-logging
    volumes: ["./authelia:/config"]
    networks: [edge]
    healthcheck:
      <<: *healthcheck-opts
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9091/api/health"]
    environment:
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET}
    labels:
      - panel.manage=true # routed via traefik/dynamic/authelia.yml, not labels

  panel-web:
    build: ./panel-frontend
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      <<: *healthcheck-opts
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
    labels: ["panel.manage=true"] # routed via traefik/dynamic/panel.yml
    networks: [edge]

  # Public portfolio site (bare domain — Authelia bypass rule for pietrasik.top
  # already lives in configuration.yml). Placeholder page for now; replace
  # compose/portfolio/index.html with the real site whenever it exists.
  # Route: traefik/dynamic/apps.yml (file provider — labels are ignored for
  # routing; see docs/RUNBOOK.md → “add an app”).
  portfolio:
    image: nginx:1.31-alpine
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      <<: *healthcheck-opts
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
    volumes: ["./portfolio:/usr/share/nginx/html:ro"]
    labels: ["panel.manage=true"] # shows in the panel's Services view
    networks: [edge]

  # ── LLM servers — uncomment + adapt once the image is built on the server ───
  # Recipe: clone this block per server, give each its own router pair in
  # traefik/dynamic/llm.yml; all servers share LLM_API_KEY from .env.
  # Auth = llama-server --api-key (OpenAI-style bearer); deliberately NO
  # auth-chain — see traefik/dynamic/llm.yml for why.
  # llm-glm:
  #   image: llama-rocm # as built/pulled on the server
  #   restart: unless-stopped
  #   logging: *default-logging
  #   # Mirror the flags from the `docker run` you use today:
  #   # user: "1000:1000"              # only if the image doesn't default to crazybot
  #   devices: ["/dev/kfd", "/dev/dri"] # ROCm
  #   # group_add: ["992", "44"]       # render/video GIDs, if your run flags pass them
  #   volumes: ["/llm:/llm:ro"]        # models — read-only is enough for inference
  #   command: >-
  #     /home/crazybot/llama/llama.cpp/build/bin/llama-server
  #     -m /llm/GLM-5.3-Flash/Q8_0/GLM-5.3-Flash-Q8_0-00001-of-00008.gguf
  #     -ngl 18 --load-mode none -c 300000 -b 2048 -ub 2048
  #     --spec-type draft-mtp --spec-draft-n-max 3
  #     --host 0.0.0.0 --port 8080
  #     --api-key ${LLM_API_KEY:?set LLM_API_KEY in .env}
  #   networks: [edge]
  #   labels: ["panel.manage=GLM-5.3-Flash"] # Services view + start/stop/restart

volumes:
  acme: {}

networks:
  edge:
    external: true
