# Edge stack: traefik + authelia + panel UI + GPU fleet + searxng. Deployed to
# /opt/panel by setup/02-deploy-stack.sh (fills .env). Routes:
# traefik/dynamic/*.yml (file provider only — no docker.sock). TLS via the
# *.pietrasik.top wildcard cert (DNS-01 via NameSilo).

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-healthcheck: &healthcheck-opts
  interval: 2m
  timeout: 10s
  retries: 3
  start_period: 1m

# YAML <<: merges SHALLOW: a block's own environment/volumes REPLACE the
# anchor's — that is why every block re-lists its model mount.
x-gpu-base: &gpu-base
  image: stilldeadcode/radiance:latest
  restart: "no"
  init: true
  logging: *default-logging
  user: "1000:1000"
  devices: ["/dev/kfd", "/dev/dri"]
  group_add: ["987", "983"] # host-local gids (Arch assigns dynamically): render, video
  security_opt:
    # radiance's io_uring + ROCm's NUMA binding are refused by Docker's
    # default seccomp
    - seccomp=unconfined
  ulimits:
    memlock: -1
  command: ["--config", "/etc/radiance/radiance.yaml"]
  volumes:
    - /models/llm:/models/llm:ro
  stop_grace_period: 60s
  healthcheck:
    interval: 1m
    timeout: 10s
    retries: 3
    start_period: 5m # the model load is the slow part — shorter reads unhealthy mid-load
    test: ["CMD", "busybox", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8000/health"]
  networks: [edge] # no network_mode: host — port 8000 stays edge-network-only

services:
  traefik:
    image: traefik:v3
    restart: unless-stopped
    logging: *default-logging
    ports: ["80:80", "443:443"]
    healthcheck:
      <<: *healthcheck-opts
      test: ["CMD", "traefik", "healthcheck", "--ping"]
    environment:
      NAMESILO_API_KEY: ${NAMESILO_API_KEY}
      NAMESILO_PROPAGATION_TIMEOUT: ${NAMESILO_PROPAGATION_TIMEOUT:-1800}
      LEGO_DISABLE_CNAME_SUPPORT: "true"
    labels:
      - panel.manage=edge router
      - panel.category=Panel
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
      - acme:/letsencrypt
    networks: [edge]

  authelia:
    image: authelia/authelia:4
    restart: unless-stopped
    logging: *default-logging
    volumes: ["./authelia:/config"]
    networks: [edge]
    healthcheck:
      <<: *healthcheck-opts
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9091/api/health"]
    environment:
      AUTHELIA_SESSION_SECRET: ${AUTHELIA_SESSION_SECRET}
      AUTHELIA_STORAGE_ENCRYPTION_KEY: ${AUTHELIA_STORAGE_ENCRYPTION_KEY}
      AUTHELIA_IDENTITY_VALIDATION_RESET_PASSWORD_JWT_SECRET: ${AUTHELIA_JWT_SECRET}
    labels:
      - panel.manage=true
      - panel.category=Panel

  panel-web:
    build: ./panel-frontend
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      <<: *healthcheck-opts
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
    labels: ["panel.manage=true", "panel.category=Panel"]
    networks: [edge]
    volumes:
      # gen artifacts: panel-api writes /models/gen-output; the UI serves them at /gen/*
      - /models/gen-output:/gen:ro

  # Placeholder page — swap compose/portfolio/ for the real site.
  portfolio:
    image: nginx:stable-alpine
    restart: unless-stopped
    logging: *default-logging
    healthcheck:
      <<: *healthcheck-opts
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
    volumes: ["./portfolio:/usr/share/nginx/html:ro"]
    labels: ["panel.manage=true", "panel.category=Web"]
    networks: [edge]

  # ── GPU fleet (Radiance) ──────────────────────────────────────────────────
  gpu-27b:
    <<: *gpu-base
    environment:
      ROCR_VISIBLE_DEVICES: "0,1"
      RADIANCE_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      RADIANCE_LOG: "warn"
    volumes:
      - /models/llm:/models/llm:ro
      - ./gpu-configs/gpu-27b.yaml:/etc/radiance/radiance.yaml:ro
    labels:
      - panel.manage=Qwen 27B IQ6R-S-V4
      - panel.category=LLM
      - gpu.cards=2
  gpu-27b-1:
    <<: *gpu-base
    environment:
      ROCR_VISIBLE_DEVICES: "2,3"
      RADIANCE_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      RADIANCE_LOG: "warn"
    volumes:
      - /models/llm:/models/llm:ro
      - ./gpu-configs/gpu-27b-1.yaml:/etc/radiance/radiance.yaml:ro
    labels:
      - panel.manage=Qwen 27B IQ6R-S-V4 1
      - panel.category=LLM
      - gpu.cards=2
  gpu-27b-2:
    <<: *gpu-base
    environment:
      ROCR_VISIBLE_DEVICES: "5,6"
      RADIANCE_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      RADIANCE_LOG: "warn"
    volumes:
      - /models/llm:/models/llm:ro
      - ./gpu-configs/gpu-27b-2.yaml:/etc/radiance/radiance.yaml:ro
    labels:
      - panel.manage=Qwen 27B IQ6R-S-V4 2
      - panel.category=LLM
      - gpu.cards=2
  gpu-flashnext:
    <<: *gpu-base
    environment:
      ROCR_VISIBLE_DEVICES: "0,1,2,3"
      RADIANCE_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      RADIANCE_LOG: "warn"
    volumes:
      - /models/llm:/models/llm:ro
      - ./gpu-configs/gpu-flashnext.yaml:/etc/radiance/radiance.yaml:ro
    labels:
      - panel.manage=Qwen Flash-Next
      - panel.category=LLM
      - gpu.cards=4
  gpu-writer:
    <<: *gpu-base
    environment:
      ROCR_VISIBLE_DEVICES: "4"
      RADIANCE_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      RADIANCE_LOG: "warn"
    volumes:
      - /models/llm:/models/llm:ro
      - ./gpu-configs/gpu-writer.yaml:/etc/radiance/radiance.yaml:ro
    labels:
      - panel.manage=Writer
      - panel.category=LLM
      - gpu.cards=1

  # ── Gen slots (private fleet instances — no public host) ──────────────────
  gpu-gentp1a:
    <<: *gpu-base
    environment:
      ROCR_VISIBLE_DEVICES: "5"
      RADIANCE_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      RADIANCE_LOG: "warn"
    volumes:
      - /models/image:/models/image:ro
      - ./gpu-configs/gpu-gentp1a.yaml:/etc/radiance/radiance.yaml:ro
    labels:
      - panel.manage=Gen TP1-A
      - gpu.cards=1
      - gpu.private=true
      - panel.category=Gen
  gpu-gentp1b:
    <<: *gpu-base
    environment:
      ROCR_VISIBLE_DEVICES: "6"
      RADIANCE_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      RADIANCE_LOG: "warn"
    volumes:
      - /models/image:/models/image:ro
      - ./gpu-configs/gpu-gentp1b.yaml:/etc/radiance/radiance.yaml:ro
    labels:
      - panel.manage=Gen TP1-B
      - gpu.cards=1
      - gpu.private=true
      - panel.category=Gen
  gpu-gentp2:
    <<: *gpu-base
    environment:
      ROCR_VISIBLE_DEVICES: "5,6"
      RADIANCE_API_KEY: ${LLM_API_KEY:?set LLM_API_KEY in .env}
      RADIANCE_LOG: "warn"
    volumes:
      - /models/video:/models/video:ro
      - ./gpu-configs/gpu-gentp2.yaml:/etc/radiance/radiance.yaml:ro
    labels:
      - panel.manage=Gen TP2
      - gpu.cards=2
      - gpu.private=true
      - panel.category=Gen

  # ── SearXNG ────────────────────────────────────────────────────────────────
  searxng:
    image: searxng/searxng:latest
    # do NOT merge *gpu-base — its restart: "no" is wrong for an always-on service
    restart: unless-stopped
    logging: *default-logging
    # the image sets no USER (a bare `docker run` is root) — this drops to 977
    user: "977:977"
    environment:
      SEARXNG_PORT: "8080"
      FORCE_OWNERSHIP: "false"
      GRANIAN_BLOCKING_THREADS: "4"
    healthcheck:
      <<: *healthcheck-opts
      # the image ships no HEALTHCHECK and make update counts a healthcheck-less
      # container as healthy — this is the only gate
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/healthz"]
    volumes:
      - ./searxng:/etc/searxng:ro
      - searxng-cache:/var/cache/searxng
    labels:
      - panel.manage=SearXNG
      - panel.category=Search
    networks: [edge]

volumes:
  acme: {}
  searxng-cache: {}

networks:
  edge:
    external: true
