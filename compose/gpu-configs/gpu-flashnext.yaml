server:
  host: 0.0.0.0
  port: 8000
  api-key-env: RADIANCE_API_KEY
memory:
  gpu-headroom-mib: 96
models:
  Qwen3.8-Flash-Next:
    model: /models/llm/qwen3.8-next-flash-iqr-v4.rad
    aliases: [default]
    tp: 4
    max-num-seqs: 8
    max-model-len: 250000 # deliberate — upstream's rows run 200000
    placement: expert_tiered
    host-pool-mib: 49152
    prefix-cache-mib: 65536
    checkpoint-policy: tip-only
    num-speculative-tokens: 3
    max-num-batched-tokens: 2048
