# gpu-flashnext — radiance 2.x reads THIS file only (`radiance --config`,
# no flags; a key is the pre-2.x flag minus its dashes — `radiance --help`
# is the reference). The API key arrives via RADIANCE_API_KEY (api-key-env),
# never written here. Config edits sync on `make update` but recreate
# nothing — restart the instance from the panel's GPU view to apply them.

# The 113 GiB IQR-V4 container REPLACES the FP8 one — radiance 2.x refuses
# block-FP8/MXFP4/M2XFP4/ParoQuant containers at startup (by the name of the
# first such weight). Keys from upstream's four-rank row for this container
# on R9700s: a CAPACITY configuration (its per-step rate at tp 4 is
# unmeasured upstream) — read the boot log's `elastic` line before trusting
# it. No tp-wire at tp 4 — four ranks run the exact all-reduce.
server:
  host: 0.0.0.0
  port: 8000
  api-key-env: RADIANCE_API_KEY
memory:
  gpu-headroom-mib: 96
models:
  Qwen3.8-Flash-Next:
    model: /models/llm/qwen3.8-next-flash-iqr-v4.rad
    aliases: [default]           # model-less requests land here
    tp: 4                        # == the block's gpu.cards (doctor cross-checks)
    max-num-seqs: 8
    max-model-len: 250000        # the pre-2.x value; upstream's rows run 200000
    placement: expert_tiered
    host-pool-mib: 49152         # 48 GiB pinned (12 GiB a rank) — the FP8 container took 24576
    prefix-cache-mib: 65536      # the host tier — 0 (the default) turns it OFF
    checkpoint-policy: tip-only  # bounds the snapshot store's pinned RAM
    num-speculative-tokens: 3    # the MTP draft head's operating point (auto resolves to it)
    max-num-batched-tokens: 2048
