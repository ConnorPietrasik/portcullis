# gpu-gentp2 — gen slot (PRIVATE: no router — see the compose block header).
# radiance 2.x takes its settings from THIS file alone: the container's
# command is `radiance --config /etc/radiance/radiance.yaml` (x-gpu-base) —
# no flags. A key is the pre-2.x flag minus its dashes, at its level (upstream
# docs/MULTIMODEL.md §4; the full reference: `radiance --help`).
#
# Gen-ONLY: minimax-h3 is the sole entry and stays resident — no in-slot LLM
# (prompt enhancement runs on the writer instance, Gen settings → enhance
# target), no ttl, nothing to swap against.
#
# The entry is the TIGHT FIT: a 62.7 GiB checkpoint = 98% of the pair's
# VRAM. It runs only because the vision tower is RAM-placed
# (`vision-tower-placement: ram` — upstream's R9700 config). No pre-flight
# check — if it doesn't fit, the first boot fails and says so: the boot
# report's `elastic` line is the acceptance test for the host-mib below.
#
# NOTE: a config edit syncs to /opt/panel on `make update` but recreates
# NOTHING (the mount path is unchanged) — radiance reads it once at start;
# restart the slot from the panel's GPUs view to apply it.

server:
  host: 0.0.0.0
  port: 8000
  api-key-env: RADIANCE_API_KEY
memory:
  gpu-headroom-mib: 96
  host-mib: 73728 # the budget the pre-writer slot design (in-slot LLM + the
  # gen model, since removed) was sized for; the gen-only pinned need (the
  # RAM-placed tower + pools) is a strict subset of it, and the budget is a
  # CEILING (what the process may pin), not a reservation
scheduler:
  load-timeout: 600s # H3's cold load (62.7 GiB + a 32B text encoder) + headroom
  drain-timeout: 30s
  warm-up: true # load the entry at start so the first job pays no disk load
models:
  minimax-h3-i8: # video with sound — int8 on the two-card pair; the 32B text
    model: /models/video/minimax-h3-i8.rad # encoder runs INSIDE this entry (VCOND)
    tp: 2 # == the block's gpu.cards (doctor cross-checks)
    vision-tower-placement: ram # the vision tower's RAM home — what makes the
    # 62.7 GiB checkpoint fit the 63.7 GiB pair
