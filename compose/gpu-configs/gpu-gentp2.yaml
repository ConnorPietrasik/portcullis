# gpu-gentp2 — gen slot (PRIVATE: no router — see the compose header).
# radiance 2.x reads THIS file only (`radiance --config`, no flags; a key
# is the pre-2.x flag minus its dashes). The API key arrives via
# RADIANCE_API_KEY (api-key-env), never written here. Config edits sync on
# `make update` but recreate nothing — restart the slot from the panel's
# GPU view to apply them.
# Gen-ONLY, resident. The entry is the TIGHT FIT: a 62.7 GiB checkpoint =
# 98% of the pair's VRAM — it runs only because the vision tower is
# RAM-placed. No pre-flight check: if it doesn't fit, the first boot fails
# and says so (the boot report's `elastic` line is the acceptance test).

server:
  host: 0.0.0.0
  port: 8000
  api-key-env: RADIANCE_API_KEY
memory:
  gpu-headroom-mib: 96
  # pinned-RAM CEILING (not a reservation): sized for the removed in-slot-LLM
  # slot design; the gen-only pinned need (the RAM-placed tower + pools) is a
  # strict subset. Never lower it on a guess
  host-mib: 73728
scheduler:
  load-timeout: 600s # H3's cold load (62.7 GiB + a 32B text encoder) + headroom
  drain-timeout: 30s
  warm-up: true # load at start so the first job pays no disk load
models:
  Minimax-H3-T2V: # video with sound — the 32B text encoder runs INSIDE this
    # entry (VCOND)
    model: /models/video/minimax-h3-i8.rad
    tp: 2 # == the block's gpu.cards (doctor cross-checks)
    vision-tower-placement: ram # what makes the 62.7 GiB checkpoint fit the 63.7 GiB pair
