server:
  host: 0.0.0.0
  port: 8000
  api-key-env: RADIANCE_API_KEY
memory:
  gpu-headroom-mib: 96
  host-mib: 73728
scheduler:
  load-timeout: 600s
  drain-timeout: 30s
  warm-up: true
models:
  # One model per card-pair at a time (a parking pair; gen_jobs.admission).
  Minimax-H3-T2V:
    model: /models/video/minimax-h3-i8.rad
    tp: 2
    vision-tower-placement: ram
    park: {ram: never}
  NoctQ-V4:
    model: /models/image/noctq-v4-uncensored-iq8r.rad
    tp: 2
    # Long-pass seat: passes past the tp1 limit land here. 30000 sits at the
    # pair's ceiling measured on this box (it loads; 32000 refuses) — sized
    # to the cards, not a preference. Re-try the bound after a radiance
    # update (tools/gpu-mlen-test.sh).
    max-model-len: 30000
    park: {ram: never}
