# No kv-cache-dtype on purpose: bf16 KV — the fp8 cache diverges on long contexts.
server:
  host: 0.0.0.0
  port: 8000
  api-key-env: RADIANCE_API_KEY
memory:
  gpu-headroom-mib: 96
models:
  Qwen3.8-27B:
    model: /models/llm/qwen3.8-27b-iq6r-s-v4.rad
    aliases: [default]
    tp: 2
    max-num-seqs: 6
    max-model-len: 250000
    prefix-cache-mib: 40960 # the host tier — 0 turns it OFF
    checkpoint-policy: tip-only
    num-speculative-tokens: 3
    max-num-batched-tokens: 2048
