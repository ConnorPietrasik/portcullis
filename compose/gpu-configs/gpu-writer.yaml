# `kernels: libr4d,spechub` (packager-recommended) is deliberately OUT: the key
# is server-level (it would bind gemma too) and a non-empty list is exclusive —
# it would narrow the kernel set for every model in this process.
server:
  host: 0.0.0.0
  port: 8000
  api-key-env: RADIANCE_API_KEY
memory:
  gpu-headroom-mib: 96
scheduler:
  load-timeout: 300s
  drain-timeout: 30s
  warm-up: true
models:
  Writer:
    model: /models/llm/hemmingway-1.5-iq4r-s-tool-tail-mtp-gptq.rad
    aliases: [default]
    tp: 1
    max-model-len: 200000
    max-num-seqs: 8
    num-speculative-tokens: auto
    draft-window: adaptive
    draft-coupling: on
    kv-cache-dtype: i8
    park: {ram: never}
  Uncensored:
    model: /models/llm/gemma4-31b-heretic-ara-a4.rad
    tp: 1
    max-model-len: 100000
    kv-cache-dtype: i8
    max-num-seqs: 8
    max-num-batched-tokens: 2048
    num-speculative-tokens: 3
    vision-tower-placement: ram
    temp: 1.0
    top-p: 0.95
    top-k: 64
    chat-template-kwargs: {enable_thinking: true}
    prefix-cache-mib: 16384
    park: {ram: never}
