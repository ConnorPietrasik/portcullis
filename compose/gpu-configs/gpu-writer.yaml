# gpu-writer — the 7th card (PCIe5 x8, the odd one out): the writer +
# uncensored chat models. x8 halves the LOAD traffic (weight loads over
# PCIe), not inference (VRAM-bandwidth-bound) — so the chat models live
# here; the swapping gen slots keep the x16 cards.
# radiance 2.x takes its settings from THIS file alone: the container's
# command is `radiance --config /etc/radiance/radiance.yaml` (x-gpu-base) —
# no flags. A key is the pre-2.x flag minus its dashes, at its level
# (upstream docs/MULTIMODEL.md §4; the full reference: `radiance --help`).
#
# Multi-model = radiance's router: both entries serve on :8000 and /v1
# routes by the `model` name. The Gen section's prompt enhancement runs on
# the "writer" entry (Gen settings → enhance target; the engine reaches this
# instance by container IP over the edge network, like the gen slots).
#
# Only ONE of the two fits the card's VRAM at a time — the other parks to
# its .rad on disk (park: {ram: never} on both: pinned host RAM is the
# scarce shared resource, and the restore pays a full load).
#
# NO `priority` on either entry (both default 0) — neither "always wins".
# Residency follows upstream's eviction order (docs §8.3):
#   * a model AT WORK is protected — it keeps its cards for a quantum after
#     it came on (another model's demand WAITS instead of evicting it), and
#     if it must still leave it is DRAINED first (its active requests
#     finish), bounded by scheduler.drain-timeout: 30s. A session is not
#     switched out mid-flight while its requests can still run — the "if
#     possible" is the 30s drain bound, after which the stragglers go.
#   * when both are IDLE, the one that would cost least to come back yields
#     first (upstream's idle/restore tiebreak — here "writer", the small
#     one), so a direct "uncensored" session keeps the card longer than a
#     writer use does.
#
# Listing order still fixes the BOOT instant: the warm-up loads the unpinned
# entries lowest priority first — LATER IN THE FILE FIRST among equals
# (upstream §8.6) — and the LAST loaded is the resident one after boot (a
# warm load parks the earlier warm load; the two can't co-reside). So
# "writer" is listed FIRST (it loads last): the enhancement path pays no
# restore right after boot, and the first "uncensored" session pays the 31B
# load. (doctor's tp cross-check reads the FIRST tp: in the file — both are
# tp 1 == gpu.cards, so the order is free as far as it is concerned.)
#
# The fit question (does one max-length sequence's KV fit beside the
# weights?) is answered by the first boot: the startup report's `vram claim`
# and `kv` lines, or the refusal that names the shortfall.
#
# NOTE: a config edit syncs to /opt/panel on `make update` but recreates
# NOTHING (the mount path is unchanged) — radiance reads it once at start;
# restart the instance from the panel's GPUs view to apply it.

server:
  host: 0.0.0.0
  port: 8000
  api-key-env: RADIANCE_API_KEY
  # The writer's packager also recommends `kernels: libr4d,spechub`. Left
  # OUT on purpose: the key is server-level (it would bind gemma4 too) and a
  # non-empty list is EXCLUSIVE — the image ships more kernel libraries than
  # those two (libhalo, libref, libavx, …), so the pin would narrow the set
  # every model in this process runs on. Default (every library the image
  # ships) is what the rest of the fleet already runs. If the writer model
  # ever misbehaves in a kernel-ish way (wrong outputs, a missing-op boot
  # failure the startup report names), that's the line to add.
memory:
  gpu-headroom-mib: 96
  # no host-mib: the fleet LLM configs leave it unset (default: 75% of the
  # host) — the 31B's 50k×8 KV host tier is too big to guess a ceiling for,
  # and the budget is a ceiling, not a reservation (the entry's own pinning
  # is bounded by its max-num-seqs / max-model-len, and park: {ram: never}
  # keeps the swaps on disk)
scheduler:
  load-timeout: 300s # cold load over x8 (half the lane's bandwidth) + headroom
  drain-timeout: 30s # the "if possible" bound on a mid-session switch (above)
  warm-up: true # load both at start (the second loaded parks the first to disk)
models:
  writer: # hemmingway 1.5 IQ4R (tool-calling, MTP) — the Gen section's prompt
    # enhancement runs on this entry. Listed first = loaded LAST by the
    # warm-up = the resident one right after boot (see the header).
    model: /models/llm/hemmingway-1.5-iq4r-s-tool-tail-mtp-gptq.rad
    aliases: [default] # model-less requests land here (the instance's default)
    tp: 1 # == the block's gpu.cards (doctor cross-checks — this is the file's first tp:)
    max-model-len: 100000
    max-num-seqs: 8 # the panel's enhance cap (gen_jobs GEN_ENHANCE_CAP — up
    # to 8 concurrent rewrites) lands here by default (the enhance target is
    # the "writer" entry — Gen settings); over-subscribing is safe (radiance
    # queues excess sequences)
    # Packager-recommended: the MTP drafter the model ships (auto = the
    # drafter's own operating point; it resolves to 0 on a container with no
    # draft head, so this line is safe either way), an adaptive draft window
    # and coupled sampling — the draft ops spechub (above) implements.
    num-speculative-tokens: auto
    draft-window: adaptive
    draft-coupling: on
    # i8 KV: K and V as int8 with one scale per token and head — halves what
    # a token of context costs in VRAM (and in this entry's boot floor)
    kv-cache-dtype: i8
    park: {ram: never} # disk only — pinned host RAM is scarce
  uncensored: # gemma 31B a4 — the unfiltered chat entry; pays the first
    # restore until a session moves "writer" out (it comes back cheap: the
    # small one yields first between sessions, see the header)
    model: /models/llm/gemma4-31b-heretic-ara-a4.rad
    tp: 1
    max-model-len: 100000 # a CEILING, not a preallocation: the KV pool is the
    # budget-resolved leftover VRAM and grows to at most max-num-seqs x this.
    # The one hard cost: one full-length sequence's KV is a BOOT FLOOR (the
    # vram ask's kv_one) — if it doesn't fit beside the weights the boot
    # refuses and names the shortfall; the boot's `vram claim`/`kv` report
    # lines are the acceptance test. 8 x ~10k concurrent (80k tokens) is
    # LESS than one 100k sequence, so the floor is the conservative side of
    # the real use.
    max-num-seqs: 8 # headroom for direct sessions (the enhance target is the
    # "writer" entry by default — repointable in Gen settings); over-
    # subscribing is safe (radiance queues excess sequences)
    # Packager-recommended (all per-model keys; the sampling three are
    # defaults for requests that do not set them):
    max-num-batched-tokens: 2048
    num-speculative-tokens: 3 # the packager's draft window — if the boot says
    # the container carries no draft head, drop this line
    vision-tower-placement: ram # the encoder towers in pinned host RAM so the
    # VRAM goes to the KV pool (the boot refuses if the model has no tower)
    temp: 1.0
    top-p: 0.95
    top-k: 64
    # the packager's per-request requirement, set as the entry default: handed
    # to the chat template on EVERY chat request to this model; a request's
    # own chat_template_kwargs still wins key by key
    chat-template-kwargs: {enable_thinking: true}
    # The long-session keeper: prefix caching is on by default (finished
    # conversations' KV is published at their close), but 0 MiB of host tier
    # means the VRAM-resident copy is LRU-dropped the moment four shorter
    # sessions fill the pool — a return then re-prefills. With the tier, the
    # long session's KV is COPIED to pinned host RAM, its VRAM goes to whoever
    # is running, and a return RESTORES instead of re-prefilling. Sized to the
    # longest conversation you expect to resume; LRU drops the oldest.
    prefix-cache-mib: 16384
    park: {ram: never} # disk only — pinned host RAM is scarce
