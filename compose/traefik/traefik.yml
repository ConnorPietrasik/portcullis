# Static config. The __ACME_EMAIL__ / __ACME_CA_SERVER__ placeholders are
# substituted by stack_sync_configs (setup/common.sh) at deploy/update.
log:
  level: INFO
accessLog: {}

ping: {}

providers:
  file:
    directory: /etc/traefik/dynamic

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
        domains:
          - main: "pietrasik.top"
            sans: ["*.pietrasik.top"]

certificatesResolvers:
  letsencrypt:
    acme:
      email: __ACME_EMAIL__
      caServer: __ACME_CA_SERVER__
      storage: /letsencrypt/acme.json
      dnsChallenge:
        provider: namesilo
        # public resolvers on purpose: via the container resolver lego can get
        # the PREVIOUS challenge token from cache (TTL 3600) and burn the
        # pre-check budget
        resolvers: ["1.1.1.1:53", "8.8.8.8:53"]
