# Traefik static config. The ACME email + caServer placeholder lines are
# substituted by stack_sync_configs (setup/common.sh — make deploy/update).

log:
  level: INFO
accessLog: {}

# /ping on the internal :8082 entrypoint — used by the compose healthcheck.
# Never published: only 80/443 are.
ping: {}

providers:
  # FILE ONLY — no docker provider, so traefik mounts no docker.sock.
  # All routers/services live in traefik/dynamic/*.yml (watched, hot-reloaded).
  file:
    directory: /etc/traefik/dynamic

entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    address: ":443"
    http:
      tls:
        certResolver: letsencrypt
        domains:
          - main: "pietrasik.top"
            sans: ["*.pietrasik.top"]

certificatesResolvers:
  letsencrypt:
    acme:
      email: __ACME_EMAIL__
      caServer: __ACME_CA_SERVER__
      storage: /letsencrypt/acme.json
      dnsChallenge:
        provider: namesilo
        # Pin lego's propagation checks to public resolvers: via the
        # container resolver (127.0.0.11 → host) they can serve the
        # PREVIOUS challenge token from cache (TTL 3600) and the pre-check
        # burns its whole 30-min budget with everything else current.
        resolvers: ["1.1.1.1:53", "8.8.8.8:53"]
