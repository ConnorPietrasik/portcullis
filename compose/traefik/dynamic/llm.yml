# LLM fallback router — llm.pietrasik.top/v1 → panel-api. One base URL for
# clients that just want the best model currently serving: panel-api walks
# the admin-configured priority order (panel Settings) and routes to the
# first instance that's up.
#
# Scoped to /v1 ONLY: panel-api also serves /api/* (the admin API), which
# must stay reachable only via panel.pietrasik.top's auth chain — on this
# host a client could supply both gate headers itself.
# LLM-scoped on purpose, and stays here (not gpu.yml): the gen slots are
# hostless (gpu.private) and could never enter the chat order.

http:
  routers:
    fleet-fallback:
      rule: "Host(`llm.pietrasik.top`) && PathPrefix(`/v1`)"
      middlewares: [sec-headers@file] # no rate limit here — see middlewares.yml
      service: panel-api
