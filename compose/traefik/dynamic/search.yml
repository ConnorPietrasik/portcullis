http:
  routers:
    search:
      rule: "Host(`search.pietrasik.top`)"
      # rate BEFORE gate: key-guessing/scan traffic consumes budget too
      middlewares: [sec-headers@file, search-rate@file, search-gate@file]
      service: searxng

    searx:
      rule: "Host(`searx.pietrasik.top`)"
      middlewares: [sec-headers@file, search-rate@file, authelia@file]
      service: searxng

  services:
    searxng:
      loadBalancer:
        servers:
          - url: "http://searxng:8080"

  middlewares:
    search-gate:
      forwardAuth:
        address: "http://172.17.0.1:8010/gate/search"
        trustForwardHeader: false
        maxResponseBodySize: 4096

    search-rate:
      rateLimit:
        # keys on the socket address (Traefik terminates TLS): do NOT add
        # forwardedHeaders/trustedIPs — it would hand the shared-key holder
        # their own rate-limit identity
        average: 2
        period: 1s
        burst: 10
