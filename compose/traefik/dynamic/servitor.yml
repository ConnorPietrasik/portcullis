# Portcullis route for the servitor agent VM.
# Raw-IP upstream: the libvirt domain sits on the edge bridge at a static
# address (invariant 2: the route is a file, no docker.sock). The IP mirrors
# SERVITOR_VM_IP/SERVITOR_BIND in /opt/servitor-repo/.env — keep in sync on
# re-address.
# Auth: the portcullis auth chain only (Authelia 2FA); the
# servitor.pietrasik.top admins-only rule pair in authelia/configuration.yml
# sits ABOVE the wildcard, or any authenticated user reaches the agent VM.
# No UFW ingress change: the route rides 443; the VM's firewall admits 8787
# from the edge subnet only.
http:
  routers:
    servitor:
      rule: "Host(`servitor.pietrasik.top`)"
      entryPoints:
        - websecure
      middlewares:
        - auth-chain@file
      service: servitor
  services:
    servitor:
      loadBalancer:
        servers:
          - url: "http://172.18.0.15:8787"
        passHostHeader: true
        # SSE contract: a stream cut by a proxy timeout is the
        # dropped-connection bug we are forbidden to reproduce.
        #  - frequent flushes (heartbeats ~15 s; deltas are disposable, but
        #    the stream must never be cut)
        #  - timeouts: Traefik v3 has NO per-service response timeout —
        #    entrypoint writeTimeout defaults to 0 and backend forwarding
        #    timeouts default to 0, so a 20-minute bash call (zero events)
        #    is never cut; the heartbeat is what keeps the client-side
        #    connection live. flushInterval is v3's only responseForwarding
        #    field (default 100ms, ignored for responses v3 recognizes as
        #    streaming) — set for the record. Do NOT re-add a readTimeout
        #    key: v3 has no such loadBalancer field and silently ignores
        #    unknown ones (that would be dead config).
        responseForwarding:
          flushInterval: 100ms
