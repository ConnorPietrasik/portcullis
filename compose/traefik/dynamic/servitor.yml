# Raw-IP upstream (the VM sits on the edge bridge): the IP mirrors
# SERVITOR_VM_IP in /opt/servitor-repo/.env — keep in sync on re-address.
http:
  routers:
    servitor:
      rule: "Host(`servitor.pietrasik.top`)"
      entryPoints:
        - websecure
      middlewares:
        - auth-chain@file
        - servitor-edge@file
      service: servitor
  services:
    servitor:
      loadBalancer:
        servers:
          - url: "http://172.18.0.15:8787"
        passHostHeader: true
        # SSE: no response timeout on purpose — a proxy-cut stream is the bug
        # we must not reproduce (v3 has no such loadBalancer key; unknown keys
        # are silently ignored, so don't add one)
        responseForwarding:
          flushInterval: 100ms
