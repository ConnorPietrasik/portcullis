# Panel routing. panel-web is reached by container DNS on the edge network;
# panel-api is the host systemd service, reached via the docker0 bridge
# gateway. The IP is explicit on purpose — NOT host.docker.internal: with a
# `host-gateway` extra_hosts entry, that name resolves to the *edge*
# network's own gateway (e.g. 172.18.0.1), where nothing listens; panel-api
# binds 172.17.0.1 only. Edge containers reach it fine: the host is their
# default gateway and owns that IP.

http:
  routers:
    panel-web:
      rule: "Host(`panel.pietrasik.top`)"
      middlewares: [auth-chain@file]
      service: panel-web
      priority: 100

    panel-api:
      rule: "Host(`panel.pietrasik.top`) && PathPrefix(`/api`)"
      middlewares: [auth-chain@file, panel-secret@file, rate-panel@file]
      service: panel-api
      priority: 200

  services:
    panel-web:
      loadBalancer:
        servers:
          - url: "http://panel-web:80"
    panel-api:
      loadBalancer:
        servers:
          - url: "http://172.17.0.1:8010"

  middlewares:
    rate-panel:
      rateLimit:
        average: 10
        period: 1s
        burst: 20
