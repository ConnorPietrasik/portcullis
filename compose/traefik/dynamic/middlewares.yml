# Shared middlewares. The __PANEL_TOKEN__ / __SERVITOR_EDGE_KEY__ values are
# placeholders — stack_sync_configs (setup/common.sh) substitutes them in the
# deployed files (which then hold secrets — chmod 600 on the server).

http:
  middlewares:
    sec-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        frameDeny: true
        contentTypeNosniff: true
        referrerPolicy: same-origin

    authelia:
      forwardAuth:
        address: http://authelia:9091/api/authz/forward-auth
        authResponseHeaders:
          - Remote-User
          - Remote-Groups
          - Remote-Email

    auth-chain:
      chain:
        middlewares: [sec-headers, authelia]

    # No rate limit on the fleet machine hosts: the API key IS the gate, and a
    # per-IP bucket shared by every client behind one NAT only punishes
    # genuine traffic.
    api-gzip:
      compress:
        excludedContentTypes: [application/zip]

    panel-secret:
      headers:
        customRequestHeaders:
          X-Panel-Token: __PANEL_TOKEN__

    servitor-edge:
      headers:
        customRequestHeaders:
          X-Servitor-Edge-Key: __SERVITOR_EDGE_KEY__
