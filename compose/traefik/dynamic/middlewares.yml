# Shared middlewares. The X-Panel-Token header value is a placeholder —
# stack_sync_configs (setup/common.sh) substitutes it in the deployed file
# (which therefore contains a secret — it is chmod 600 on the server).

http:
  middlewares:
    sec-headers:
      headers:
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        frameDeny: true # X-Frame-Options: DENY — nothing here needs to be iframed
        contentTypeNosniff: true
        referrerPolicy: same-origin

    # Authelia forward-auth. Traefik strips any client-supplied Remote-*
    # headers and replaces them with Authelia's verdict. /api/authz/forward-auth
    # is the 4.38+ replacement for the deprecated /api/verify?rd=… — the portal
    # URL now comes from the session cookie's authelia_url, so the rd parameter
    # is gone.
    authelia:
      forwardAuth:
        address: http://authelia:9091/api/authz/forward-auth
        authResponseHeaders:
          - Remote-User
          - Remote-Groups
          - Remote-Email

    auth-chain:
      chain:
        middlewares: [sec-headers, authelia]

    # No rate-limit middleware on the fleet's machine-API hosts (per-instance
    # subdomains + llm.pietrasik.top). The API key IS the gate: a wrong key
    # 401s before any GPU work, and at 256 bits of entropy guessing is
    # infeasible at any rate; radiance's admission control (429 +
    # Retry-After) is the backpressure that actually bounds GPU spend. A
    # per-IP token bucket shared by every client behind one NAT (the
    # dashboard's 5 req/s /history polling, agents on the same box) only
    # punished genuine traffic while a leaked key from another IP would
    # bypass it entirely. If you are tempted to re-add one: don't.

    # Injected into requests forwarded to the panel API only. Clients cannot
    # set this header themselves — Traefik overwrites it.
    panel-secret:
      headers:
        customRequestHeaders:
          X-Panel-Token: __PANEL_TOKEN__
