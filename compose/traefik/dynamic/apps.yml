http:
  routers:
    portfolio:
      rule: "Host(`pietrasik.top`) || Host(`www.pietrasik.top`)"
      middlewares: [sec-headers@file] # public — no auth chain (bypass rules in authelia/configuration.yml)
      service: portfolio

  services:
    portfolio:
      loadBalancer:
        servers:
          - url: "http://portfolio:80"
