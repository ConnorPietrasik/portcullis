# llm-flashnext — radiance 2.x takes its settings from THIS file alone: the
# container's command is `radiance --config /etc/radiance/radiance.yaml`
# (x-llm-base) — no flags. A key is the pre-2.x flag minus its dashes, at its
# level (upstream docs/MULTIMODEL.md §4; the full reference: `radiance --help`):
#   server:  host / port / api-key(-env)
#   memory:  gpu-headroom-mib
#   models:  everything else, under one entry (the entry's name is the model id)
#
# The API key reaches the server through RADIANCE_API_KEY in the block's
# environment (api-key-env) — it is never written into this file.
#
# Validate without serving:
#   RADIANCE_API_KEY=<key> docker run --rm --entrypoint radiance \
#     stilldeadcode/radiance:latest --config /dev/stdin --check < this-file
#
# NOTE: a config edit syncs to /opt/panel on `make update` but recreates
# NOTHING (the mount path is unchanged) — radiance reads it once at start;
# restart the instance from the panel's GPUs view to apply it.

# The 113 GiB IQR-V4 container (IQR-V4 experts, int8 trunk, MTP draft head,
# vision) REPLACES the FP8 one — radiance 2.x refuses block-FP8/MXFP4/M2XFP4/
# ParoQuant containers at startup, by the name of the first such weight.
# Keys from upstream's four-rank row for this container on R9700s — a CAPACITY
# configuration (its per-step rate vs tp: 2 is unmeasured upstream): read the
# boot log's `elastic` line and re-derive host-pool-mib before trusting it.
# No tp-wire at tp: 4 — four ranks run the EXACT all-reduce (wht6 is the lossy
# 2/3-rank wire; 8 ranks have none).
server:
  host: 0.0.0.0
  port: 8000
  api-key-env: RADIANCE_API_KEY
memory:
  gpu-headroom-mib: 96
models:
  Qwen3.8-Flash-Next:
    model: /models/qwen3.8-next-flash-iqr-v4.rad
    aliases: [default]           # model-less requests land here
    tp: 4                        # == the block's llm.cards (doctor cross-checks)
    max-num-seqs: 8
    max-model-len: 250000        # the pre-2.x value; upstream's rows run 200000
    placement: expert_tiered
    host-pool-mib: 49152         # 48 GiB pinned, 12 GiB a rank (the FP8 container
                                 # took 24576 — the IQR-V4 weights are bigger)
    prefix-cache-mib: 65536      # the host tier — 0 (the default) turns it OFF
    checkpoint-policy: tip-only  # kept from the pre-2.x line (see llm-27b.yaml)
    num-speculative-tokens: 3    # the MTP draft head's operating point (default
                                 # auto resolves to it)
    max-num-batched-tokens: 2048
